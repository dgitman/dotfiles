name: Daily cask updates
on:
  schedule:
    - cron: '0 3 * * *'
      timezone: America/New_York
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/daily-cask-updates.yml'
      - '.github/scripts/*casks*.py'
permissions:
  contents: read
concurrency:
  group: daily-cask-updates
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s .github/scripts -p 'test_bump_casks.py'
  bump:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: macos-latest
    timeout-minutes: 180
    env:
      HOMEBREW_NO_INSTALL_FROM_API: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_ENV_HINTS: '1'
      HOMEBREW_NO_COLOR: '1'
      GH_TOKEN: ${{ secrets.HOMEBREW_BUMP_TOKEN }}
      HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_BUMP_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check authentication
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Add the HOMEBREW_BUMP_TOKEN repository secret before running this workflow."
            exit 1
          fi
          test "$(gh api user --jq .login)" = dgitman
      - name: Prepare Homebrew
        run: |
          brew update
          brew tap --force homebrew/cask
          gh auth setup-git
      - name: Check, validate, and submit one cask update
        run: python3 .github/scripts/bump-casks.py
